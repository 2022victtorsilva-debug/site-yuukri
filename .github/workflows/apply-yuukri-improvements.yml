name: Apply Yuukri improvements

on:
  push:
    paths:
      - ".github/workflows/apply-yuukri-improvements.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply requested improvements
        run: python .yuukri-tools/apply_improvements.py

      - name: Validate and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Melhora animações e portfólio da Yuukri"
          git push
